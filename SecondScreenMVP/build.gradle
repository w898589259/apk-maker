gradle

// 1. 删除 buildscript 里的 repositories（这就是导致之前一直报错的元凶！）

buildscript {

dependencies {

// 这两行保留，这是编译必须的插件

classpath 'com.android.tools.build:gradle:7.4.2'

classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"

}

}

// 2. 同样删除 allprojects 里的 repositories

// 因为我们已经在 settings.gradle 里统一管理了，这里留着就会冲突

// 3. 【终极必杀技】直接在这里硬塞两个国内镜像地址！

// 不管机器读不读 settings，这里它一定能看到，保证依赖包能下载下来

ext {

repo阿里云 = 'https://maven.aliyun.com/repository/public/
'

repo腾讯云 = 'https://mirrors.cloud.tencent.com/repository/maven-public/
'
// 强行把这些地址注入到全局
repositories {
    maven { url repo阿里云 }
    maven { url repo腾讯云 }
    google()
    mavenCentral()
}

}
